<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" fill="none">
  <!-- Brand Icon -->
  <g transform="translate(4, 6)">
    <!-- Outer Shield / Flow Energy Ring -->
    <path d="M30 4C15.64 4 4 15.64 4 30C4 44.36 15.64 56 30 56C44.36 56 56 44.36 56 30" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Dynamic Energy Flow Wave (Orange) -->
    <path d="M12 36C18 36 22 20 30 20C38 20 42 34 50 34" stroke="#E87A00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Solar / Power Pulse -->
    <circle cx="30" cy="20" r="4" fill="#E87A00" />
    
    <!-- Secondary Precision Flow (Lighter Blue Accent) -->
    <path d="M22 44C27 44 31 38 38 38" stroke="#A4BDD6" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Top Right Spark / Energy Node -->
    <circle cx="48" cy="12" r="3.5" fill="#E87A00" />
    <path d="M48 6V18M42 12H54" stroke="#E87A00" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(76, 20)">
    <!-- FLOWNERGY -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="1.5" fill="#FFFFFF">
      FLOWN<tspan fill="#E87A00">ERGY</tspan>
    </text>
    <!-- GLOBAL LIMITED -->
    <text x="2" y="41" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" letter-spacing="4.5" fill="#A4BDD6">
      GLOBAL LIMITED
    </text>
  </g>
</svg>
